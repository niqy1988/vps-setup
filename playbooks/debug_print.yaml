---
- name: Print all local variables
  hosts: localhost
  tasks:
    - name: Print hostvars for this control node
      ansible.builtin.debug:
        var: hostvars[inventory_hostname]

- name: Print all hostnames
  hosts: all
  become: true
  tasks:
    - name: Print current hostname
      ansible.builtin.debug:
        msg: "hostname is: {{ inventory_hostname }}"

- name: Print ansible username
  hosts: all
  become: true
  tasks:
    - name: Print all available facts
      ansible.builtin.debug:
        var: "ansible username is {{ ansible_user }}"
