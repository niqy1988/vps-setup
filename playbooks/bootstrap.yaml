---
- name: Provision base packages on Debian servers
  hosts: all
  gather_facts: false
  vars:
    ansible_user: "{{ bootstrap_username | default('root') }}"
  tasks:
    - name: Install sudo and python3 environment for basic ansible functionality
      ansible.builtin.raw: |
        apt update &&
        apt install -y sudo python3 python3-apt
      changed_when: false

- name: Set up ansible remote user
  hosts: all
  vars:
    ansible_user: "{{ bootstrap_username | default('root') }}"
  roles:
    - role: ansible_access

- name: Update timezone
  hosts: all
  become: true
  tasks:
    - name: Set timezone to Shanghai
      community.general.timezone:
        name: Asia/Shanghai
      notify: Reboot the server and wait for it to return
  handlers:
    - name: Reboot the server and wait for it to return
      ansible.builtin.reboot:
        reboot_timeout: 600

- name: Install and update critical packages
  hosts: all
  become: true
  tasks:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600 # Only updates if it hasn't been updated in the last hour (3600 seconds)
    - name: Install Chinese locale
      ansible.builtin.apt:
        name: locales-all
        state: present
    - name: Install Python pip
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-packaging
        state: present
    - name: Install ACL tools
      ansible.builtin.apt:
        name: acl
        state: present
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
    - name: Install logrotate
      ansible.builtin.apt:
        name: logrotate
        state: present
    - name: Update existing packages
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true

- name: Set up base file system structure
  hosts: all
  become: true
  tasks:
    - name: Create app folder
      ansible.builtin.file:
        path: /app
        state: directory
        mode: "0755"
    - name: Create data folder, default to be owned by "users" group
      ansible.builtin.file:
        path: /data
        state: directory
        group: users
        mode: "02775"
    - name: Sets default ACL for data folder
      ansible.posix.acl:
        path: /data
        entity: users
        etype: group
        permissions: rwx
        default: true
        state: present

- name: Setup daily logrotate
  hosts: all
  become: true
  tasks:
    - name: Ensure logrotate automation is active via systemd timer
      ansible.builtin.systemd_service:
        name: logrotate.timer
        state: started
        enabled: true

- name: Update ssh security configs
  hosts: all
  become: true
  tasks:
    - name: Find all existing sshd_config files
      ansible.builtin.find:
        paths: /etc/ssh/sshd_config.d/
      register: sshd_config_files
    - name: Remove everything except default configs
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ sshd_config_files.files }}"
      when: item.path | basename != '00-default.conf'
      notify: Reload SSH Service
    - name: Drop in custom ssh config
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-default.conf
        content: |
          # Security Settings
          PermitEmptyPasswords no
          PasswordAuthentication no
          PermitRootLogin prohibit-password
          PubkeyAuthentication yes

          # Connection Lifecycles
          LoginGraceTime 30s
          ClientAliveInterval 30
          ClientAliveCountMax 6
          PerSourceMaxStartups 3

          # Feature Disabling
          X11Forwarding no
          GSSAPIAuthentication no
          PermitUserRC no
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH Service
  handlers:
    - name: Reload SSH Service
      ansible.builtin.systemd_service:
        name: ssh
        enabled: true
        state: reloaded

- name: Enable TCP BBR congestion control algorithm
  hosts: all
  become: true
  tasks:
    - name: Enable bbr and reload sysctl
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - name: net.core.default_qdisc
          value: fq
        - name: net.ipv4.tcp_congestion_control
          value: bbr

- name: Initialize ufw
  hosts: all
  become: true
  tasks:
    - name: Allow SSH
      community.general.ufw:
        rule: allow
        name: OpenSSH
    - name: Default deny incoming traffic
      community.general.ufw:
        default: deny
        direction: incoming
    - name: Default allow outgoing traffic
      community.general.ufw:
        default: allow
        direction: outgoing
    - name: Enable ufw
      community.general.ufw:
        state: enabled
    - name: Start ufw service
      ansible.builtin.systemd_service:
        name: ufw
        enabled: true
        state: started

- name: Set up interactive user
  hosts: interactive
  vars:
    interactive_sudoer: true
    interactive_user_groups:
      - users
  roles:
    - role: interactive_access
