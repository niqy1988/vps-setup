# --- plex ---
# 以下为角色默认值（defaults/main.yaml），可覆盖
plex_container: plex
plex_path: /app/plex
plex_version: latest
plex_subdomain: plex
plex_direct_port: 32400
# 媒体库 rclone 挂载名（其 <mount>/Media 目录被暴露为 /data/Media）
plex_rclone_mount: "<remote>"
plex_media_path: /data/Media
# 首次认领 token（敏感，用占位符替换）
plex_claim_token: "<plex_claim_token>"
