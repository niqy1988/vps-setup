# --- ansible_access：Ansible 远程管理账号（sudoer） ---
# 以下为角色默认值（defaults/main.yaml），可覆盖
ansible_username: ansible_remote
ansible_uid: 900000
# ssh 公钥无默认，必须在此设置（敏感，用占位符替换）
ansible_ssh_public_key: "<ssh_public_key>"

# --- interactive_access：交互式登录账号 ---
# 用户名 / 密码 / 公钥无默认，必须在此设置
interactive_username: "<interactive_username>"
interactive_password: "<password>"
interactive_uid: 100000
interactive_user_groups:
  - users
interactive_sudoer: false
interactive_ssh_public_key: "<ssh_public_key>"
