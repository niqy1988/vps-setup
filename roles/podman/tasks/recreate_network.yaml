---

- name: Remove existing podman network
  become: true
  become_user: "{{ podman_username }}"
  containers.podman.podman_network:
    name: "{{ podman_network }}"
    state: absent

- name: Create podman network
  become: true
  become_user: "{{ podman_username }}"
  ansible.builtin.systemd_service:
    name: "{{ podman_network }}-network"
    scope: user
    daemon_reload: true
    enabled: true
    state: restarted
