- name: Install podman with supporting packages
  become: true
  ansible.builtin.apt:
    name:
      - podman
      - uidmap
    state: present

- name: Install podman python bindings for ansible access
  become: true
  ansible.builtin.apt:
    name: python3-podman
    state: present

- name: Set subuid and subgid range for podman user
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/{{ item }}"
    regexp: "^{{ podman_username }}"
    line: "{{ podman_username }}:{{ podman_uid | int + 1 }}:65535"
  loop:
    - subuid
    - subgid

- name: Setup quadlet directory
  become: true
  become_user: "{{ podman_username }}"
  ansible.builtin.file:
    path: "/home/{{ podman_username }}/.config/containers/systemd"
    recurse: true
    state: directory

- name: Setup default podman bridge network
  become: true
  become_user: "{{ podman_username }}"
  containers.podman.podman_network:
    name: "{{ podman_network }}"
    state: quadlet # noqa: args[module]
    ipv6: true
  notify:
    - Create podman network

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable podman auto-update service
  become: true
  become_user: "{{ podman_username }}"
  ansible.builtin.systemd_service:
    name: "podman-auto-update.service"
    scope: user
    daemon_reload: true
    enabled: true

- name: Start podman auto-update timer
  become: true
  become_user: "{{ podman_username }}"
  ansible.builtin.systemd_service:
    name: "podman-auto-update.timer"
    scope: user
    daemon_reload: true
    enabled: true
    state: started

- name: Enable podman socket service
  become: true
  become_user: "{{ podman_username }}"
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    daemon_reload: true
    enabled: true
    state: started
