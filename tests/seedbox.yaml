---
- name: Update existing packages
  hosts: seedbox
  become: true
  tasks:
    - name: Update packages
      package:
        name: "*"
        state: latest

# - name: Set up rclone drives
#   hosts: seedbox
#   roles:
#     - role: rclone

- name: Set up qBittorrent
  hosts: seedbox
  vars:
    qbittorrent_networks: "{{ bt_networks }}"
  roles:
    - role: qbittorrent
